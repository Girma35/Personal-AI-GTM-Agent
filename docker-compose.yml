version: "3.9"

services:
  # ─── PostgreSQL ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gtm-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gtm_agent}
      POSTGRES_USER: ${POSTGRES_USER:-gtm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gtm_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gtm_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── n8n (workflow automation) ────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: gtm-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-gtm_agent}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-gtm_user}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-gtm_secret}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
